name: Research cronjob.org monitoring and venue-separate forward shadow (NO ORDERS)
on:
  push:
    branches: [test/systematic-trading-research]
    paths:
      - '.github/workflows/research-external-monitor-and-forward.yml'
      - 'research/external_cron_heartbeat.py'
      - 'research/forward_shadow_summary.py'
      - 'research/mexc_ohlcv_provenance.py'
      - 'tests/test_external_cron_heartbeat.py'
      - 'tests/test_forward_shadow_summary.py'
      - 'tests/test_mexc_ohlcv_provenance.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  github-vs-external-heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect GitHub run events separately from external scheduler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=master&per_page=100" \
            > "$RUNNER_TEMP/github_runs.json"
          python -m research.external_cron_heartbeat \
            --github-runs "$RUNNER_TEMP/github_runs.json" \
            --output reports/external_scheduler_health.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/external_scheduler_health.json').read_text())
          assert r["scheduler_declared_by_user"]=="cron-job.org"
          assert r["scheduler_reported_interval_seconds"]==60
          assert r["cronjob_history_available"] is False
          assert r["github_workflow_trigger_proven_from_external_history"] is False
          assert r["http_success_proves_market_publication"] is False
          assert r["orders_executed"]==0
          print("GITHUB_AND_EXTERNAL_NOT_CONFLATED",True)
          PY
      - name: Archive public counts, no cronjob.org secrets or URLs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-heartbeat-not-directly-verified
          path: reports/external_scheduler_health.json
          retention-days: 7
          if-no-files-found: warn

  mexc-venue-ohclv:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query bounded MEXC public ORCA 15m and 1m candles only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json,time
          from pathlib import Path
          from research.mexc_ohlcv_provenance import retrieve,validate
          now=int(time.time())
          end=(now//900-1)*900
          for interval,lookback in (("Min15",12*3600),("Min1",2*3600)):
              try:
                  data=retrieve("ORCA_USDT",interval,end-lookback,end)
                  report=validate("ORCA_USDT",interval,end-lookback,end,data,
                                  observed_at_s=int(time.time()))
              except Exception as exc:
                  # ValueError messages come from our static schema validators,
                  # never raw HTTP request headers, credentials or personal data.
                  public_validation_issue=(
                      str(exc)[:120] if isinstance(exc,ValueError)
                      else "PUBLIC_REQUEST_OR_PROVIDER_UNAVAILABLE"
                  )
                  report={"status":"UNAVAILABLE","instrument":"ORCA_USDT",
                          "interval":interval,"reason_type":type(exc).__name__,
                          "validation_issue":public_validation_issue,
                          "signals_or_fills_estimated":0,
                          "profitable_edge_proven":False,"production_changed":False}
              Path(f"reports/mexc_{interval}_source.json").write_text(
                  json.dumps(report,indent=2)+"\n")
              print("MEXC_SOURCE_PROVENANCE",json.dumps(report,sort_keys=True))
          PY
      - name: Reject future candles, invented fills and mixed-exchange OHLCV
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for interval in ("Min1","Min15"):
              r=json.loads(Path(f"reports/mexc_{interval}_source.json").read_text())
              assert r["interval"]==interval
              assert r["instrument"]=="ORCA_USDT"
              assert r["signals_or_fills_estimated"]==0
              assert r["profitable_edge_proven"] is False
              assert r["production_changed"] is False
              if r["status"]=="MEXC_PUBLIC_OHLCV_PROVENANCE_ONLY":
                  assert r["venue"]=="mexc_usdt_perpetual"
                  assert r["all_bars_closed_at_observation"] is True
                  assert r["point_in_time_tradable_bid_ask_verified"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mexc-orca-public-ohlcv-validation
          path: reports/mexc_*_source.json
          retention-days: 7
          if-no-files-found: warn

  same-payload-three-scan-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MARKET_PROVIDER: okx_swap
      RESEARCH_TICKER_CLOCK_MODE: receipt
      UNIVERSE_SIZE: '50'
      MIN_VALIDATED: '15'
      MAX_PRESCREEN: '90'
      MIN_VOLUME_USDT: '2000000'
      PRIORITY_VOLUME_USDT: '5000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Three complete independent public OKX collection attempts, no orders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for i in 1 2 3; do
            rm -f output/market_data.json output/research_receipt_clock_shadow.json
            if python collector.py && python -m research.receipt_clock_shadow \
                --market-data output/market_data.json \
                --report output/research_receipt_clock_shadow.json; then
              cp output/research_receipt_clock_shadow.json "reports/shadow_$i.json"
            else
              echo "::warning::Scan $i unavailable: censored, NOT zero eligible"
              printf '{"status":"UNAVAILABLE"}\n' > "reports/shadow_$i.json"
            fi
            if [ "$i" -lt 3 ]; then sleep 12; fi
          done
          python -m research.forward_shadow_summary \
            --report reports/forward_shadow_aggregate.json \
            reports/shadow_1.json reports/shadow_2.json reports/shadow_3.json
      - name: Validate report means nothing about financial expectancy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("reports/forward_shadow_aggregate.json").read_text())
          assert r["planned_scan_slots"]==3
          assert r["completed_scans"]+r["failed_or_censored_slots"]==3
          assert r["net_expectancy_proven"] is False
          assert r["no_order_submission"] is True
          assert r["production_changed"] is False
          print("THREE_SCAN_SHADOW_SAFETY",True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forward-three-scan-clock-shadow-aggregate
          path: reports/forward_shadow_aggregate.json
          retention-days: 7
          if-no-files-found: warn
