name: OKX - Coleta e publicacao de dados

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'collector.py'
      - 'publish_views.py'
      - 'experimental_scan.py'
      - 'trade_decision.py'
      - 'entry_trigger.py'
      - 'tests/test_entry_trigger.py'
      - 'sync_market_data.py'
      - 'tests/test_sync_market_data.py'
      - 'tests/test_experimental_scan.py'
      - 'tests/test_trade_decision.py'
      - '.github/workflows/scan.yml'
  schedule:
    # Um minuto APOS cada fechamento de 15m (UTC).
    # Nao iniciar antes do fechamento, pois o processo pode publicar
    # candle anterior e perder o gatilho valido na janela seguinte.
    # O GitHub Actions pode atrasar a execucao.
    - cron: '1,16,31,46 * * * *'

permissions:
  contents: write

concurrency:
  group: okx-market-data-publish
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET_PROVIDER: okx_swap
      UNIVERSE_SIZE: '50'
      MIN_VALIDATED: '15'
      MAX_PRESCREEN: '90'
      MIN_VOLUME_USDT: '2000000'
      PRIORITY_VOLUME_USDT: '5000000'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Coletar candles
        run: python collector.py

      - name: Validar coleta e gerar manifesto
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path('output/market_data.json')
          assert source.is_file(), 'Arquivo output/market_data.json nao foi gerado'
          data = json.loads(source.read_text(encoding='utf-8'))
          assert data.get('status') == 'COLLECTED', 'Coleta nao concluida'
          assert data.get('venue') == 'okx_swap', 'Fonte inesperada'
          assert data.get('market_type') == 'USDT_PERPETUAL', 'Mercado inesperado'
          stamp = datetime.fromisoformat(data['collected_utc'].replace('Z', '+00:00'))
          age = time.time() - stamp.timestamp()
          assert -120 <= age <= 1800, f'Coleta desatualizada: {age:.0f}s'

          universe = data.get('universe', [])
          candles = data.get('candles', {})
          symbols = [a['symbol'] for a in universe]
          assert len(symbols) >= 15, f'Poucos ativos: {len(symbols)}'
          assert len(symbols) == len(set(symbols)), 'Simbolos duplicados'
          durations = {'2h': 7200000, '1h': 3600000, '15m': 900000}
          for symbol in symbols:
              assert symbol in candles, f'Ativo sem candles: {symbol}'
              for timeframe, duration in durations.items():
                  rows = candles[symbol].get(timeframe, [])
                  assert len(rows) >= 60, f'{symbol}/{timeframe} tem poucos candles'
                  assert all(b[0] - a[0] == duration for a, b in zip(rows, rows[1:])), f'Lacunas em {symbol}/{timeframe}'

          manifest = {
              'status': 'OK',
              'collected_utc': data['collected_utc'],
              'asset_count': len(symbols),
              'market': 'OKX USDT perpetual',
              'timeframes': list(durations),
              'file': 'market_data.json',
          }
          Path('output/manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'VALIDADO: {len(symbols)} ativos; coleta de {age:.0f}s atras')
          PY

      - name: Gerar resumo e arquivos individuais por moeda
        run: python publish_views.py

      - name: Verificar alertas antecipados de risco em 5m (opcional)
        shell: bash
        run: |
          # A falha nesta etapa auxiliar nao impede a publicacao dos candles principais.
          python early_warning.py || echo 'Aviso: a verificacao auxiliar 5m falhou; dados principais preservados.'
          if [ ! -f output/early_warning.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/market_data.json').read_text(encoding='utf-8'))
          Path('output/early_warning.json').write_text(json.dumps({
              'status': 'UNAVAILABLE', 'source_collected_utc': data['collected_utc'],
              'scanned': 0, 'warnings': [], 'trade_signals_allowed': False,
          }, indent=2), encoding='utf-8')
          PY
          fi

      - name: Gerar niveis de entrada e radar de 0.5 ATR (opcional)
        shell: bash
        run: |
          # Extra informativo: nenhuma falha pode bloquear candles e resumo.
          if python -m unittest discover -s tests -p 'test_*.py' -v \
            && python trade_decision.py \
                  --market-data output/market_data.json \
                  --output output/trade_decisions.json \
                  --watch-output output/entry_watch.json
          then
            echo 'Radar de entrada V2 atualizado'
          else
            echo 'Aviso: radar experimental indisponivel. Coleta preservada.'
          fi
          if [ ! -f output/entry_watch.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/market_data.json').read_text(encoding='utf-8'))
          result={
              'status':'UNAVAILABLE', 'source_collected_utc':data['collected_utc'],
              'source_asset_count':len(data['universe']),
              'retained_asset_count':len(data['universe']),
              'proximity_alert_count':0, 'proximity_alerts':[], 'watchlist':[],
              'order_allowed':False,
              'reason':'testes ou geracao experimental falharam; sem sinais',
          }
          Path('output/entry_watch.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          fi
          if [ ! -f output/trade_decisions.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('output/market_data.json').read_text(encoding='utf-8'))
          Path('output/trade_decisions.json').write_text(
              json.dumps({'status':'UNAVAILABLE',
                          'source_collected_utc':data['collected_utc'],
                          'ranked_setups':[], 'order_allowed':False},
                         ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/manifest.json')
          manifest=json.loads(p.read_text(encoding='utf-8'))
          watch=json.loads(Path('output/entry_watch.json').read_text(encoding='utf-8'))
          manifest['entry_watch_file']='entry_watch.json'
          manifest['entry_watch_status']=watch['status']
          manifest['entry_trigger_engine']='breakout_or_retest_independent_next_15m_tick_size'
          manifest['entry_watch_source_sync_status']=watch.get('source_sync_status','UNAVAILABLE')
          manifest['entry_watch_source_candle_utc']=watch.get('source_sync',{}).get('source_last_closed_15m_utc')
          manifest['entry_watch_can_offer_current_entries']=watch.get('current_for_new_entries',False)
          manifest['entry_watch_proximity_alert_count']=watch['proximity_alert_count']
          if Path('output/trade_decisions.json').is_file():
              manifest['trade_decisions_file']='trade_decisions.json'
          p.write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Salvar ZIP opcional para auditoria
        uses: actions/upload-artifact@v6
        with:
          name: okx-data-${{ github.run_id }}
          path: |
            output/market_data.json
            output/manifest.json
            output/scan_summary.json
            output/early_warning.json
            output/entry_watch.json
            output/trade_decisions.json
          retention-days: 3
          if-no-files-found: error

      - name: Publicar JSON na branch market-data
        shell: bash
        run: |
          set -euo pipefail

          # Guarda os artefatos gerados antes de trocar de branch.
          cp output/market_data.json "$RUNNER_TEMP/market_data.json"
          cp output/manifest.json "$RUNNER_TEMP/manifest.json"
          cp output/scan_summary.json "$RUNNER_TEMP/scan_summary.json"
          cp output/early_warning.json "$RUNNER_TEMP/early_warning.json"
          cp output/entry_watch.json "$RUNNER_TEMP/entry_watch.json"
          if [ -f output/trade_decisions.json ]; then
            cp output/trade_decisions.json "$RUNNER_TEMP/trade_decisions.json"
          fi
          mkdir -p "$RUNNER_TEMP/okx-coins"
          cp output/coins/*.json "$RUNNER_TEMP/okx-coins/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin market-data
          git switch -C market-data FETCH_HEAD

          cp "$RUNNER_TEMP/market_data.json" ./market_data.json
          cp "$RUNNER_TEMP/manifest.json" ./manifest.json
          cp "$RUNNER_TEMP/scan_summary.json" ./scan_summary.json
          cp "$RUNNER_TEMP/early_warning.json" ./early_warning.json
          cp "$RUNNER_TEMP/entry_watch.json" ./entry_watch.json
          if [ -f "$RUNNER_TEMP/trade_decisions.json" ]; then
            cp "$RUNNER_TEMP/trade_decisions.json" ./trade_decisions.json
          else
            rm -f ./trade_decisions.json
          fi

          # Apaga apenas a pasta dedicada; evita arquivos antigos de moedas
          # que deixaram de fazer parte do universo de 50 ativos.
          rm -rf ./coins
          mkdir -p ./coins
          cp "$RUNNER_TEMP"/okx-coins/*.json ./coins/

          git add -A -- market_data.json manifest.json scan_summary.json early_warning.json entry_watch.json trade_decisions.json coins
          git diff --cached --quiet && { echo 'Sem dados novos para publicar'; exit 0; }

          git commit -m "data: coleta OKX $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:refs/heads/market-data

          echo "RESUMO: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/market-data/scan_summary.json"
          echo "RADAR: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/market-data/entry_watch.json"
          echo "MANIFESTO: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/market-data/manifest.json"
          echo "EXEMPLO SOL: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/market-data/coins/SOL-USDT-SWAP.json"
