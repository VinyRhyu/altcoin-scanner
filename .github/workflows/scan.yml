
name: Altcoin Scanner V2 (research)

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: read

concurrency:
  group: altcoin-scanner-v2
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      MARKET_PROVIDER: auto
      UNIVERSE_SIZE: '20'
      MIN_VALIDATED: '15'
      MAX_PRESCREEN: '65'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect closed OHLCV
        run: python collector.py

      - name: Run prototype signal analyzer (NO alerts)
        run: python analyzer.py
      
      - name: Historical replay V3 (research only)
        run: python replay.py

      - name: Upload diagnostics and paper candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altcoin-v2-${{ github.run_id }}
          path: output/
          retention-days: 3
          if-no-files-found: warn
      
