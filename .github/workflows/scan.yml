
name: Coleta OKX - Dados para ChatGPT

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "collector.py"
      - "validate_data.py"
      - "scripts/publish-data.sh"
      - ".github/workflows/scan.yml"

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: okx-market-data-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MARKET_PROVIDER: okx_swap
      UNIVERSE_SIZE: "50"
      MIN_VALIDATED: "15"
      MAX_PRESCREEN: "90"
      MIN_VOLUME_USDT: "2000000"
      PRIORITY_VOLUME_USDT: "5000000"
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Coletar candles da OKX
        run: python collector.py

      - name: Validar dados
        run: python validate_data.py

      - name: Salvar copia dos dados
        uses: actions/upload-artifact@v6
        with:
          name: market-data-${{ github.run_id }}
          path: |
            output/market_data.json
            output/manifest.json
          retention-days: 3

      - name: Publicar JSON no GitHub
        run: bash scripts/publish-data.sh
