name: Scanner V2 - Executar manualmente

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-experimental-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar codigo da branch experimental
        uses: actions/checkout@v4
        with:
          ref: experiment/non-exclusion-v2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes de nao-exclusao e de classificacao
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Obter snapshot publicado sem modificar a coleta
        shell: bash
        run: |
          git fetch origin market-data
          git show FETCH_HEAD:market_data.json > market_data.json
          git show FETCH_HEAD:early_warning.json > early_warning.json
      - name: Testar com snapshot real e salvar ranking
        shell: bash
        run: |
          python experimental_scan.py --market-data market_data.json --early-warning early_warning.json --output experimental_rank.json
          python - <<'PY'
          import json
          data = json.load(open('experimental_rank.json'))
          assert data['source_asset_count'] == data['retained_asset_count']
          assert data['analyzed_asset_count'] + data['unavailable_asset_count'] == data['source_asset_count']
          assert not data['trade_signals_allowed']
          print('VALIDADO: nenhuma exclusao pos-coleta')
          PY
      - name: Avaliar entradas LONG/SHORT sem executar ordens
        run: |
          python trade_decision.py --market-data market_data.json --output experimental_decisions.json --watch-output experimental_entry_watch.json
          python - <<'PY'
          import json
          d = json.load(open('experimental_decisions.json'))
          assert d['source_asset_count'] == d['retained_asset_count']
          assert d['analyzed_asset_count'] == d['source_asset_count'], 'Alguns ativos nao foram analisados'
          assert len(d['ranked_setups']) == d['source_asset_count'] * 2
          assert not d['order_allowed']
          assert len(d['ranked_setups']) == 2 * d['source_asset_count']
          assert all(len(plan['entry_methods']) == 2 for plan in d['ranked_setups'])
          assert not any(plan['order_allowed'] for side in d['ranked_setups']
                         for plan in side['entry_methods'])
          assert all(plan['entry_trigger_price'] is None or plan['tick_size']
                     for side in d['ranked_setups'] for plan in side['entry_methods'])
          watch = json.load(open('experimental_entry_watch.json'))
          assert watch['retained_asset_count'] == d['retained_asset_count']
          assert watch['proximity_alert_count'] == len(watch['proximity_alerts'])
          assert not watch['order_allowed']
          print('TESTE DE DECISAO:', d['source_asset_count'], 'ativos e', len(d['ranked_setups']), 'direcoes')
          PY
      - name: Replay sem lookahead com historico 15m/1h/2h
        run: |
          python replay_entry_triggers.py --market-data market_data.json --output experimental_replay.json
          python - <<'PY'
          import json
          d=json.load(open('experimental_replay.json'))
          assert d['not_a_profitability_backtest']
          assert d['no_lookahead']
          assert d['asset_count'] >= 15
          assert d['samples_checked'] > 0
          assert d['confirmed'] == d['conditional'] + d['blocked']
          print('REPLAY OK:', d['samples_checked'], d['confirmed'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-v2-experimental
          path: |
            experimental_rank.json
            experimental_decisions.json
            experimental_entry_watch.json
            experimental_replay.json
          retention-days: 7

      - name: Publicar resultado apenas na branch experimental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experimental_rank.json experimental_decisions.json experimental_entry_watch.json experimental_replay.json
          if git diff --cached --quiet; then
            echo 'Resultado experimental inalterado'
            exit 0
          fi
          git commit -m "test: salvar diagnostico experimental da coleta"
          git push origin HEAD:refs/heads/experiment/non-exclusion-v2
